<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Content Manager — Scoop Patrol Aberdare</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/assets/logo.jpg" type="image/jpeg" />
  <style>
    /* Decap's plain-text fields (widget: "text" — most short fields: names,
       headings, card blurbs) render as native <textarea>s. Force a visible
       resize handle and a taller starting size so they're easier to work
       in, regardless of whatever Decap's own default happens to be.
       The long-form prose fields (legal sections, generic-page rich text
       blocks) use widget: "richtext" instead — a rich editor that grows
       with its content, so this rule doesn't apply there and isn't needed. */
    textarea {
      resize: vertical !important;
      min-height: 9em !important;
    }
  </style>
</head>
<body>
  <!-- Decap CMS reads ./config.yml automatically. Loaded from the CDN, no
       build step or npm dependency required for the admin page itself. -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
