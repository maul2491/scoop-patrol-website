# Decap CMS configuration for Scoop Patrol Aberdare.
#
# Edits made here commit directly to the `main` branch of the GitHub repo,
# which triggers a Cloudflare Worker rebuild (Cloudflare must be configured to
# run `node build.mjs` as its build command — see CMS-SETUP.md for the
# one-time setup this admin panel depends on).
#
# Login requires a GitHub OAuth App + a small token-exchange proxy — both set
# up, see cms-oauth-worker/worker.js.

backend:
  name: github
  repo: maul2491/scoop-patrol-website
  branch: main
  base_url: https://scoop-patrol-cms-auth.scooppatrolwales.workers.dev
  auth_endpoint: auth

# Where uploaded images land, and the public URL prefix used in content.
media_folder: "assets"
public_folder: "/assets"

site_url: https://scooppatrolaberdare.co.uk
logo_url: /assets/logo.jpg

collections:
  - name: "reviews"
    label: "Reviews"
    files:
      - name: "reviews"
        label: "Customer Reviews"
        file: "content/reviews.json"
        fields:
          - label: "Reviews"
            name: "reviews"
            widget: "list"
            summary: "{{name}} ({{platform}})"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Platform", name: "platform", widget: "select", options: ["Google", "Facebook"] }
              - { label: "Review text", name: "text", widget: "text" }

  - name: "before_after"
    label: "Before & After Photos"
    files:
      - name: "pairs"
        label: "Before / After Pairs"
        file: "content/before-after.json"
        fields:
          - label: "Photo pairs"
            name: "pairs"
            widget: "list"
            summary: "{{fields.beforeAlt}}"
            fields:
              - { label: "Before photo", name: "before", widget: "image" }
              - { label: "Before photo — WebP (optional, leave blank to skip)", name: "beforeWebp", widget: "image", required: false }
              - { label: "Before photo alt text", name: "beforeAlt", widget: "string", hint: "Describe the garden before the clean, for screen readers and SEO" }
              - { label: "After photo", name: "after", widget: "image" }
              - { label: "After photo — WebP (optional, leave blank to skip)", name: "afterWebp", widget: "image", required: false }
              - { label: "After photo alt text", name: "afterAlt", widget: "string" }

  - name: "navigation"
    label: "Navigation"
    files:
      - name: "nav"
        label: "Menus"
        file: "content/nav.json"
        fields:
          - label: "Main menu (Home and Services are fixed, everything else lists here)"
            name: "main"
            widget: "list"
            summary: "{{label}}"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Link", name: "href", widget: "string", hint: "e.g. /about or /contact" }
          - label: "Services dropdown"
            name: "services"
            widget: "list"
            summary: "{{label}}"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Link", name: "href", widget: "string" }

  - name: "footer"
    label: "Footer"
    files:
      - name: "footer"
        label: "Footer"
        file: "content/footer.json"
        fields:
          - { label: "Tagline (under the logo)", name: "tagline", widget: "text" }
          - label: "Link columns"
            name: "columns"
            widget: "list"
            summary: "{{heading}}"
            fields:
              - { label: "Column heading", name: "heading", widget: "string" }
              - label: "Links"
                name: "links"
                widget: "list"
                summary: "{{label}}"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Link", name: "href", widget: "string" }
                  - { label: "Indent as a sub-item", name: "sub", widget: "boolean", required: false, default: false }

  - name: "homepage"
    label: "Homepage"
    files:
      - name: "homepage"
        label: "Homepage content"
        file: "content/homepage.json"
        fields:
          - label: "Search & browser tab (SEO)"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Title tag", name: "title", widget: "string" }
              - { label: "Meta description", name: "description", widget: "text" }
          - label: "Hero (top of page)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Heading", name: "headingPrefix", widget: "string" }
              - { label: "Heading highlight (shown in green)", name: "headingHighlight", widget: "string" }
              - { label: "Lead paragraph", name: "lead", widget: "text" }
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Photo — WebP (optional)", name: "imageWebp", widget: "image", required: false }
              - { label: "Photo alt text", name: "imageAlt", widget: "string" }
              - { label: "Badge text (small chip over the photo)", name: "badgeText", widget: "string" }
          - label: "Pricing section heading (above the price table)"
            name: "pricing"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead paragraph", name: "lead", widget: "text" }
          - label: "Before & after section heading"
            name: "spotTheDifference"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
          - label: "Reviews section heading"
            name: "reviews"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
          - label: "\"Why Scoop Patrol\" section"
            name: "why"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead paragraph", name: "lead", widget: "text" }
              - { label: "Bullet points", name: "points", widget: "list" }
              - { label: "Photo (summer)", name: "imageSummer", widget: "image" }
              - { label: "Photo (summer) — WebP (optional)", name: "imageSummerWebp", widget: "image", required: false }
              - { label: "Photo (autumn, cross-fades with summer)", name: "imageAutumn", widget: "image" }
              - { label: "Photo (autumn) — WebP (optional)", name: "imageAutumnWebp", widget: "image", required: false }
              - { label: "Photo alt text", name: "imageAlt", widget: "string" }
          - label: "\"Who we work with\" section heading"
            name: "whoWeWorkWith"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead paragraph", name: "lead", widget: "text" }
          - label: "\"What to expect\" section heading"
            name: "whatToExpect"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead paragraph", name: "lead", widget: "text" }
          - label: "\"Where we patrol\" section"
            name: "areas"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead paragraph", name: "lead", widget: "text" }
          - label: "\"How to book\" section"
            name: "howToBook"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead paragraph", name: "lead", widget: "text" }
              - label: "The two \"how to book\" cards"
                name: "cards"
                widget: "list"
                summary: "{{heading}}"
                fields:
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Numbered steps", name: "steps", widget: "list" }
          - label: "Quote form section heading (above the homepage contact form)"
            name: "quoteSection"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead paragraph", name: "lead", widget: "text" }
          - label: "Final call-to-action band (bottom of page)"
            name: "finalCta"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }

  - name: "services_pages"
    label: "Services Pages"
    files:
      - name: "services"
        label: "Services Pages"
        file: "content/services.json"
        fields:
          - label: "Services hub (/services)"
            name: "index"
            widget: "object"
            fields:
              - { label: "Search & browser tab (SEO)", name: "seo", widget: "object", fields: [
                    { label: "Title tag", name: "title", widget: "string" },
                    { label: "Meta description", name: "description", widget: "text" },
                  ] }
              - { label: "Hero", name: "hero", widget: "object", fields: [
                    { label: "Kicker", name: "kicker", widget: "string" },
                    { label: "Heading", name: "h1", widget: "string" },
                    { label: "Lead paragraph", name: "lead", widget: "text" },
                  ] }
              - label: "Hub cards"
                name: "hubCards"
                widget: "list"
                summary: "{{title}}"
                fields:
                  - { label: "Links to", name: "href", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Body", name: "body", widget: "text" }
          - label: "Pricing page (/services/pricing)"
            name: "pricing"
            widget: "object"
            fields:
              - { label: "Search & browser tab (SEO)", name: "seo", widget: "object", fields: [
                    { label: "Title tag", name: "title", widget: "string" },
                    { label: "Meta description", name: "description", widget: "text" },
                  ] }
              - { label: "Hero", name: "hero", widget: "object", fields: [
                    { label: "Kicker", name: "kicker", widget: "string" },
                    { label: "Heading", name: "h1", widget: "string" },
                    { label: "Lead paragraph", name: "lead", widget: "text" },
                  ] }
              - label: "What affects your price — cards"
                name: "priceFactors"
                widget: "list"
                summary: "{{heading}}"
                fields:
                  - { label: "Icon (single emoji)", name: "icon", widget: "string" }
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Body", name: "body", widget: "text" }
              - label: "Pricing FAQs"
                name: "faq"
                widget: "list"
                summary: "{{q}}"
                fields:
                  - { label: "Question", name: "q", widget: "string" }
                  - { label: "Answer", name: "a", widget: "text" }
          - label: "Garden cleans page (/services/garden-cleans)"
            name: "gardenCleans"
            widget: "object"
            fields:
              - { label: "Search & browser tab (SEO)", name: "seo", widget: "object", fields: [
                    { label: "Title tag", name: "title", widget: "string" },
                    { label: "Meta description", name: "description", widget: "text" },
                  ] }
              - { label: "Hero", name: "hero", widget: "object", fields: [
                    { label: "Kicker", name: "kicker", widget: "string" },
                    { label: "Heading", name: "h1", widget: "string" },
                    { label: "Lead paragraph", name: "lead", widget: "text" },
                  ] }
              - label: "What's included"
                name: "whatIncluded"
                widget: "object"
                fields:
                  - { label: "Intro paragraph", name: "lead", widget: "text" }
                  - { label: "Tick-list items", name: "items", widget: "list" }
              - label: "Frequency cards"
                name: "frequencyCards"
                widget: "list"
                summary: "{{heading}}"
                fields:
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Body", name: "body", widget: "text" }
              - { label: "First cleans note (basic HTML allowed, e.g. <strong>)", name: "firstCleansNote", widget: "text" }
              - label: "Surfaces section"
                name: "surfaces"
                widget: "object"
                fields:
                  - { label: "Paragraph 1", name: "lead1", widget: "text" }
                  - { label: "Paragraph 2", name: "lead2", widget: "text" }
                  - { label: "Callout heading", name: "calloutHeading", widget: "string" }
                  - { label: "Callout paragraph 1", name: "calloutP1", widget: "text" }
                  - { label: "Callout paragraph 2", name: "calloutP2", widget: "text" }
              - { label: "Winter section paragraph", name: "winter", widget: "object", fields: [{ label: "Paragraph", name: "lead", widget: "text" }] }
          - label: "Pet waste collection page (/services/pet-waste-collection)"
            name: "petWasteCollection"
            widget: "object"
            fields:
              - { label: "Search & browser tab (SEO)", name: "seo", widget: "object", fields: [
                    { label: "Title tag", name: "title", widget: "string" },
                    { label: "Meta description", name: "description", widget: "text" },
                  ] }
              - { label: "Hero", name: "hero", widget: "object", fields: [
                    { label: "Kicker", name: "kicker", widget: "string" },
                    { label: "Heading", name: "h1", widget: "string" },
                    { label: "Lead paragraph", name: "lead", widget: "text" },
                  ] }
              - label: "Pricing table rows"
                name: "pricingRows"
                widget: "list"
                summary: "{{service}}"
                fields:
                  - { label: "Service", name: "service", widget: "string" }
                  - { label: "Price", name: "price", widget: "string" }
              - { label: "\"Regular or one-off\" heading", name: "regularOrOneOff", widget: "object", fields: [
                    { label: "Heading", name: "heading", widget: "string" },
                    { label: "Body", name: "body", widget: "text" },
                  ] }
              - { label: "\"Who it's for\"", name: "whoItsFor", widget: "object", fields: [
                    { label: "Heading", name: "heading", widget: "string" },
                    { label: "Body (basic HTML allowed)", name: "body", widget: "text" },
                  ] }
              - { label: "Legal disposal section", name: "legal", widget: "object", fields: [
                    { label: "Heading", name: "heading", widget: "string" },
                    { label: "Body", name: "body", widget: "text" },
                  ] }
              - label: "Cat litter add-on section"
                name: "catLitter"
                widget: "object"
                fields:
                  - { label: "Intro", name: "intro", widget: "text" }
                  - { label: "How it works", name: "howItWorks", widget: "text" }
                  - { label: "Cost (basic HTML allowed)", name: "cost", widget: "text" }
                  - { label: "Callout body (basic HTML allowed)", name: "calloutBody", widget: "text" }
              - { label: "Closing call-to-action", name: "cta", widget: "object", fields: [
                    { label: "Heading", name: "heading", widget: "string" },
                    { label: "Body", name: "body", widget: "text" },
                  ] }

  - name: "commercial_page"
    label: "Commercial Page"
    files:
      - name: "commercial"
        label: "Commercial Page"
        file: "content/commercial.json"
        fields:
          - { label: "Search & browser tab (SEO)", name: "seo", widget: "object", fields: [
                { label: "Title tag", name: "title", widget: "string" },
                { label: "Meta description", name: "description", widget: "text" },
              ] }
          - { label: "Hero", name: "hero", widget: "object", fields: [
                { label: "Kicker", name: "kicker", widget: "string" },
                { label: "Heading", name: "h1", widget: "string" },
                { label: "Lead paragraph", name: "lead", widget: "text" },
              ] }
          - { label: "Compliance callout (basic HTML allowed)", name: "compliance", widget: "object", fields: [{ label: "Why it matters", name: "why", widget: "text" }] }
          - label: "Sectors we work with"
            name: "sectors"
            widget: "list"
            summary: "{{heading}}"
            fields:
              - { label: "Icon (single emoji)", name: "icon", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
          - { label: "Surfaces section", name: "surfaces", widget: "object", fields: [
                { label: "Paragraph 1", name: "body1", widget: "text" },
                { label: "Paragraph 2 (basic HTML allowed)", name: "body2", widget: "text" },
              ] }
          - { label: "Pricing section", name: "pricing", widget: "object", fields: [{ label: "Body", name: "body", widget: "text" }] }
          - { label: "Closing call-to-action", name: "cta", widget: "object", fields: [
                { label: "Eyebrow", name: "eyebrow", widget: "string" },
                { label: "Heading", name: "heading", widget: "string" },
                { label: "Body", name: "body", widget: "text" },
              ] }

  - name: "faq_page"
    label: "FAQ Page"
    files:
      - name: "faq"
        label: "FAQ Page"
        file: "content/faq.json"
        fields:
          - { label: "Search & browser tab (SEO)", name: "seo", widget: "object", fields: [
                { label: "Title tag", name: "title", widget: "string" },
                { label: "Meta description", name: "description", widget: "text" },
              ] }
          - { label: "Hero", name: "hero", widget: "object", fields: [
                { label: "Kicker", name: "kicker", widget: "string" },
                { label: "Heading", name: "h1", widget: "string" },
                { label: "Lead paragraph", name: "lead", widget: "text" },
              ] }
          - label: "Question groups"
            name: "groups"
            widget: "list"
            summary: "{{group}}"
            hint: "Two answers (areas covered, waste disposal) are generated automatically from business details elsewhere and don't appear here."
            fields:
              - { label: "Group name", name: "group", widget: "string" }
              - label: "Questions"
                name: "items"
                widget: "list"
                summary: "{{q}}"
                fields:
                  - { label: "Question", name: "q", widget: "string" }
                  - { label: "Answer (plain text, used for search-engine markup)", name: "text", widget: "text" }
                  - { label: "Answer with links (optional, shown on page instead of the plain one above — must say the same thing)", name: "html", widget: "text", required: false }

  - name: "contact_page"
    label: "Contact Page"
    files:
      - name: "contact"
        label: "Contact Page"
        file: "content/contact.json"
        fields:
          - { label: "Search & browser tab (SEO)", name: "seo", widget: "object", fields: [
                { label: "Title tag", name: "title", widget: "string" },
                { label: "Meta description", name: "description", widget: "text" },
              ] }
          - { label: "Hero", name: "hero", widget: "object", fields: [
                { label: "Kicker", name: "kicker", widget: "string" },
                { label: "Heading", name: "h1", widget: "string" },
                { label: "Lead paragraph", name: "lead", widget: "text" },
              ] }
          - { label: "\"Quickest ways to reach us\" heading", name: "asideHeading", widget: "string" }
          - { label: "\"Or fill this in\" heading", name: "formHeading", widget: "string" }
          - { label: "Form intro line", name: "formIntro", widget: "text" }
          - { label: "Closing call-to-action", name: "cta", widget: "object", fields: [
                { label: "Eyebrow", name: "eyebrow", widget: "string" },
                { label: "Heading", name: "heading", widget: "string" },
                { label: "Body", name: "body", widget: "text" },
              ] }

  - name: "legal_pages"
    label: "Legal Pages"
    files:
      - name: "legal"
        label: "Legal Pages"
        file: "content/legal.json"
        fields:
          - label: "Privacy Policy"
            name: "privacyPolicy"
            widget: "object"
            fields:
              - { label: "Search & browser tab (SEO)", name: "seo", widget: "object", fields: [
                    { label: "Title tag", name: "title", widget: "string" },
                    { label: "Meta description", name: "description", widget: "text" },
                  ] }
              - label: "Sections"
                name: "sections"
                widget: "list"
                summary: "{{heading}}"
                fields:
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Body", name: "body", widget: "text", hint: "Blank line = new paragraph. Start a line with \"- \" for a bullet list. HTML like <strong>, <a href=\"...\">, <h3> and <table> works and passes through as typed." }
          - label: "Cookie Policy"
            name: "cookiePolicy"
            widget: "object"
            fields:
              - { label: "Search & browser tab (SEO)", name: "seo", widget: "object", fields: [
                    { label: "Title tag", name: "title", widget: "string" },
                    { label: "Meta description", name: "description", widget: "text" },
                  ] }
              - label: "Sections"
                name: "sections"
                widget: "list"
                summary: "{{heading}}"
                fields:
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Body", name: "body", widget: "text", hint: "Blank line = new paragraph. Start a line with \"- \" for a bullet list. HTML like <strong>, <a href=\"...\"> works and passes through as typed." }
          - label: "Terms & Conditions"
            name: "terms"
            widget: "object"
            fields:
              - { label: "Search & browser tab (SEO)", name: "seo", widget: "object", fields: [
                    { label: "Title tag", name: "title", widget: "string" },
                    { label: "Meta description", name: "description", widget: "text" },
                  ] }
              - label: "Sections (numbered and listed in the on-page contents automatically)"
                name: "sections"
                widget: "list"
                summary: "{{heading}}"
                fields:
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Body", name: "body", widget: "text", hint: "Blank line = new paragraph. Start a line with \"- \" for a bullet list. HTML like <strong>, <a href=\"...\"> works and passes through as typed." }

  - name: "pages"
    label: "Extra Pages"
    description: "Create a new page, or open an existing one and use \"Duplicate\" to start a similar one. New pages aren't linked from the menu automatically — add a link in Navigation once you're happy with it."
    folder: "content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Page title", name: "title", widget: "string" }
      - { label: "URL slug (letters, numbers, hyphens only, e.g. \"summer-offer\")", name: "slug", widget: "string" }
      - { label: "Meta description (for search engines, one sentence)", name: "description", widget: "text", required: false }
      - label: "Hero (top banner)"
        name: "hero"
        widget: "object"
        fields:
          - { label: "Kicker (small label above the heading)", name: "kicker", widget: "string", required: false }
          - { label: "Heading", name: "h1", widget: "string" }
          - { label: "Lead paragraph", name: "lead", widget: "text", required: false }
      - label: "Content blocks (shown in order)"
        name: "blocks"
        widget: "list"
        summary: "{{fields.type}} — {{fields.heading}}"
        types:
          - label: "Rich text"
            name: "richText"
            widget: "object"
            fields:
              - { label: "Block type", name: "type", widget: "hidden", default: "richText" }
              - { label: "Heading (optional)", name: "heading", widget: "string", required: false }
              - { label: "Body", name: "body", widget: "text", hint: "Blank line = new paragraph. Start a line with \"- \" for a bullet list. HTML like <strong>, <a href=\"...\"> works." }
          - label: "Image + text"
            name: "imageText"
            widget: "object"
            fields:
              - { label: "Block type", name: "type", widget: "hidden", default: "imageText" }
              - { label: "Heading (optional)", name: "heading", widget: "string", required: false }
              - { label: "Body", name: "body", widget: "text" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Image alt text", name: "imageAlt", widget: "string", required: false }
              - { label: "Image side", name: "imagePosition", widget: "select", options: ["right", "left"], default: "right" }
          - label: "FAQ list"
            name: "faqList"
            widget: "object"
            fields:
              - { label: "Block type", name: "type", widget: "hidden", default: "faqList" }
              - { label: "Heading (optional)", name: "heading", widget: "string", required: false }
              - label: "Questions"
                name: "items"
                widget: "list"
                summary: "{{q}}"
                fields:
                  - { label: "Question", name: "q", widget: "string" }
                  - { label: "Answer", name: "a", widget: "text" }
          - label: "Call to action band"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Block type", name: "type", widget: "hidden", default: "cta" }
              - { label: "Eyebrow (small label)", name: "eyebrow", widget: "string", required: false }
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Body", name: "body", widget: "text", required: false }
